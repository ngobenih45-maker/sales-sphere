
<!DOCTYPE html>
<html>
<head>
<title>SalesSphere V2 Builder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>SalesSphere™ V2</h1>
<p>Create your digital sales platform</p>
</header>

<section class="card">
<h2>Create Your SalesSphere</h2>
<input id="name" placeholder="Your Name">
<input id="company" placeholder="Company">
<select id="industry">
<option>Automotive</option>
<option>Property</option>
<option>Insurance</option>
<option>Technology</option>
<option>Finance</option>
</select>
<textarea id="bio" placeholder="Your sales introduction"></textarea>
<button onclick="createSphere()">Generate Profile</button>
</section>

<section id="preview" class="card"></section>

<section class="card">
<h2>Add Lead</h2>
<input id="lead" placeholder="Customer name">
<button onclick="saveLead()">Save Lead</button>
<div id="leads"></div>
</section>

<script src="script.js"></script>
</body>
</html>
